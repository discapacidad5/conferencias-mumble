services:
  conferencia:
    build: .
    container_name: conferencia
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: "/data"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      APP_SECRET: "${APP_SECRET:-conferencia-secret-0123456789abcdef}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - conf-data:/data

volumes:
  conf-data:
