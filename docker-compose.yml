services:
  mumble-server:
    image: mumblevoip/mumble-server:latest
    container_name: mumble-server
    restart: unless-stopped
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - ./murmur.ini:/etc/mumble/config.ini:ro
      - mumble-data:/data

  conferencia-mumble:
    build: .
    container_name: conferencia-mumble
    restart: unless-stopped
    depends_on:
      - mumble-server
    environment:
      PORT: "3000"
      DATA_DIR: "/data"
      MUMBLE_LOCAL_ADDR: "${MUMBLE_LOCAL_ADDR:-mumble-server:64738}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      APP_SECRET: "${APP_SECRET:-mumble-conferencias-secret-0123456789abcdef}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - conf-data:/data

volumes:
  mumble-data:
  conf-data:
